<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Border Test</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
}

/* ── ONE wood border ──
   Previously the main frame (.wood-layout/.felt-frame) and the clock
   were two separately-painted wood elements that had to be color- and
   shadow-matched at their seam — which is exactly what kept breaking.
   Here there is only one wood-painting element, .wood-layout, for the
   entire viewport. The green felt is a single shape (#felt-surface)
   clipped to a rounded rect with a rectangular notch bitten out of its
   bottom-left corner — sized to fit the clock — via an SVG clip-path
   built in JS (so the rounded corners stay true circles regardless of
   the felt's aspect ratio, which a pure-CSS clip-path polygon can't
   do). Wherever the felt is clipped away, the *same* wood-layout
   background simply shows through underneath — there is nothing else
   to paint there, so there is nothing that can seam. */
.wood-layout{
  width:100%;height:100%;
  background:
    repeating-linear-gradient(94deg,
      rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px,
      transparent 1px, transparent 5px),
    repeating-linear-gradient(94deg,
      rgba(255,130,90,0.05) 0px, rgba(255,130,90,0.05) 1px,
      transparent 1px, transparent 11px),
    linear-gradient(165deg,#3d1712 0%,#5c2a1e 30%,#431c15 55%,#552419 80%,#361310 100%);
  background-attachment:fixed;
}
.felt-frame{
  position:relative;
  width:100%;height:100%;
  padding:0.25in;
  /* Bottom-left is left unrounded (0) — that whole corner is where the
     notch replaces the rounded corner, so nothing should round there. */
  border-radius:calc(16px + 0.25in) calc(16px + 0.25in) calc(16px + 0.25in) 0;
  overflow:hidden;
}
#felt-surface{
  width:100%;height:100%;
  background:#2e8b57;
  background:radial-gradient(140% 120% at 50% 50%,#2e8b57 0%,#20613d 100%);
  box-shadow:
    inset 0 0 14vh rgba(0,0,0,0.28),
    inset 0 10px 14px -8px rgba(0,0,0,0.55),
    inset 0 -10px 14px -8px rgba(0,0,0,0.55),
    inset 10px 0 14px -8px rgba(0,0,0,0.55),
    inset -10px 0 14px -8px rgba(0,0,0,0.55);
  clip-path:url(#feltClip);
}
/* The same warm rim-light + drop-shadow the main frame always used at
   the wood/felt step-down — now automatically traces the notch's edges
   too, since it's clipped to the exact same shape as the felt. This is
   the payoff of merging the two borders: one glow, one shape, no
   separate treatment needed for the clock's portion of the edge. */
.felt-frame::after{
  content:'';position:absolute;pointer-events:none;z-index:5;
  top:0.25in;left:0.25in;right:0.25in;bottom:0.25in;
  box-shadow:0 0 10px 2px rgba(255,190,150,0.28),0 2px 3px rgba(0,0,0,0.5);
  clip-path:url(#feltClip);
}

/* ── The clock plaque sits in the notch ──
   No background, no rail, no wood of its own at all: the notch already
   shows .wood-layout's own background through the gap in the felt, so
   the plaque just needs to be positioned in the right spot. Anchored to
   .felt-frame (not #felt-surface) specifically so it isn't a descendant
   of the clipped element — a descendant would be clipped away along
   with the felt in the notch area, exactly where the plaque needs to
   be visible. `bottom/left: 0.25in` (not `0`) accounts for that: the
   containing block is .felt-frame's own padding box (its outer edge),
   so the offset has to re-add the padding that #felt-surface's box
   would otherwise have absorbed. */
#clock-platform{
  position:absolute;bottom:0.25in;left:0.25in;z-index:6;
  padding:0.25in 0.25in 0 0;
  pointer-events:none;
}
#clock-plaque{
  position:relative;
  padding:1.2vh 1.8vw;
  background:radial-gradient(130% 130% at 35% 30%,#ffffff 0%,#e4e0d6 100%);
  border-radius:16px;
  box-shadow:
    0 0 10px 2px rgba(255,190,150,0.28),0 2px 3px rgba(0,0,0,0.5),
    inset 0 0 20px rgba(0,0,0,0.18),
    inset 0 6px 8px -5px rgba(0,0,0,0.45),
    inset 0 -6px 8px -5px rgba(0,0,0,0.45),
    inset 6px 0 8px -5px rgba(0,0,0,0.45),
    inset -6px 0 8px -5px rgba(0,0,0,0.45);
}
#mb-clock{
  font-family:'Inter',sans-serif;font-weight:700;
  font-size:11vh;color:#111;line-height:1;white-space:nowrap;
}
</style>
</head>
<body>
<div class="wood-layout">
  <div class="felt-frame">
    <svg width="0" height="0" style="position:absolute">
      <clipPath id="feltClip" clipPathUnits="userSpaceOnUse">
        <path id="feltClipPath"></path>
      </clipPath>
    </svg>
    <div id="felt-surface"></div>
    <div id="clock-platform">
      <div id="clock-plaque"><span id="mb-clock">9:00</span></div>
    </div>
  </div>
</div>
<script>
// Builds the felt's rounded-rect-with-a-notch clip path in the felt
// surface's own pixel space, and sizes the clock's footprint to match
// the notch exactly. Recomputed on resize since it's all pixel-based.
function layoutFeltClip(){
  var felt = document.getElementById('felt-surface');
  var w = felt.clientWidth, h = felt.clientHeight;
  var r = 16;                    // outer corner radius, matches the real app
  var notchW = w * 0.1945;       // clock footprint, proportional to felt size
  var notchH = h * 0.1736;       // (matches the real app's measured proportions)

  var d = [
    'M', r, 0,
    'H', (w - r),
    'A', r, r, 0, 0, 1, w, r,
    'V', (h - r),
    'A', r, r, 0, 0, 1, (w - r), h,
    'H', notchW,
    'V', (h - notchH),
    'H', 0,
    'V', r,
    'A', r, r, 0, 0, 1, r, 0,
    'Z'
  ].join(' ');

  document.getElementById('feltClipPath').setAttribute('d', d);

  var clockPlatform = document.getElementById('clock-platform');
  clockPlatform.style.width = notchW + 'px';
  clockPlatform.style.height = notchH + 'px';
}
window.addEventListener('resize', layoutFeltClip);
layoutFeltClip();
</script>
</body>
</html>
