<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Border Test</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
}

/* ── Felt window, copied verbatim from index.html — the main wood
   frame (.wood-layout/.felt-frame, plus its ::after rim-glow) has been
   removed so the felt fills the viewport directly, isolating the
   clock's own border from the main border it would normally sit in. ── */
.felt-surface{
  width:100%;height:100%;
  background:#2e8b57;
  background:radial-gradient(140% 120% at 50% 50%,#2e8b57 0%,#20613d 100%);
  box-shadow:
    inset 0 0 14vh rgba(0,0,0,0.28),
    inset 0 10px 14px -8px rgba(0,0,0,0.55),
    inset 0 -10px 14px -8px rgba(0,0,0,0.55),
    inset 10px 0 14px -8px rgba(0,0,0,0.55),
    inset -10px 0 14px -8px rgba(0,0,0,0.55);
}

/* ── The clock assembly under test, copied verbatim from index.html ── */
#cd-zone{position:relative;z-index:0;width:100%;height:100%;}
.clock-wood{
  background:
    repeating-linear-gradient(94deg,
      rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px,
      transparent 1px, transparent 5px),
    repeating-linear-gradient(94deg,
      rgba(255,130,90,0.05) 0px, rgba(255,130,90,0.05) 1px,
      transparent 1px, transparent 11px),
    linear-gradient(165deg,#3d1712 0%,#5c2a1e 30%,#431c15 55%,#552419 80%,#361310 100%);
  background-attachment:fixed;
}
#clock-platform{
  position:absolute;bottom:0;left:0;z-index:-1;
  padding:0.25in 0.25in 0 0;
  border-radius:0 calc(16px + 0.25in) 0 0;
  pointer-events:none;
}
.clock-rail{position:absolute;inset:0;border-radius:0 calc(16px + 0.25in) 0 0;overflow:hidden;}
#clock-plaque{
  position:relative;
  padding:1.2vh 1.8vw;
  background:radial-gradient(130% 130% at 35% 30%,#ffffff 0%,#e4e0d6 100%);
  border-radius:16px;
  box-shadow:
    0 0 10px 2px rgba(255,190,150,0.28),0 2px 3px rgba(0,0,0,0.5),
    inset 0 0 20px rgba(0,0,0,0.18),
    inset 0 6px 8px -5px rgba(0,0,0,0.45),
    inset 0 -6px 8px -5px rgba(0,0,0,0.45),
    inset 6px 0 8px -5px rgba(0,0,0,0.45),
    inset -6px 0 8px -5px rgba(0,0,0,0.45);
}
#mb-clock{
  font-family:'Inter',sans-serif;font-weight:700;
  font-size:11vh;color:#111;line-height:1;white-space:nowrap;
}
</style>
</head>
<body>
<div class="felt-surface">
  <div id="cd-zone">
    <div id="clock-platform">
      <div class="clock-rail clock-wood"></div>
      <div id="clock-plaque"><span id="mb-clock">9:00</span></div>
    </div>
  </div>
</div>
</body>
</html>
